# Push a tag like v0.5.0 → builds wp-mcp-tools-0.5.0.zip (git archive, honours .gitattributes export-ignore)
# and attaches it to a GitHub release; sites with WP MCP Tools 0.5.0+ pick it up (includes/class-updater.php).
# The tag must equal WPMCP_VERSION. Run manually to just get the zip as a build artifact.
# (Automatic adapter updates publish their release from update-mcp-adapter.yml instead.)
name: Release zip

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        id: zip
        run: |
          VERSION=$(grep -oP "define\( 'WPMCP_VERSION', '\K[^']+" wp-mcp-tools.php)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match WPMCP_VERSION $VERSION"; exit 1
          fi
          git archive --format=zip --prefix=wp-mcp-tools/ -o "wp-mcp-tools-$VERSION.zip" HEAD
          echo "file=wp-mcp-tools-$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: Sign zip
        id: sign
        env:
          WPMCP_SIGNING_KEY: ${{ secrets.WPMCP_SIGNING_KEY }}
        run: |
          # Once includes/release-public.pem is committed, sites refuse unsigned zips, so a missing secret must stop the release.
          if [ -f includes/release-public.pem ]; then
            [ -n "$WPMCP_SIGNING_KEY" ] || { echo "::error::includes/release-public.pem exists but secret WPMCP_SIGNING_KEY is empty"; exit 1; }
            bash bin/sign-release.sh "${{ steps.zip.outputs.file }}"
            printf 'files<<EOF\n%s\n%s.sig\nEOF\n' "${{ steps.zip.outputs.file }}" "${{ steps.zip.outputs.file }}" >> "$GITHUB_OUTPUT"
          else
            printf 'files<<EOF\n%s\nEOF\n' "${{ steps.zip.outputs.file }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.file }}
          path: ${{ steps.sign.outputs.files }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.sign.outputs.files }}
