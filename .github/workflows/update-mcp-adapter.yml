# Weekly check for a new WordPress MCP Adapter release.
# When one exists: update composer.json/composer.lock/vendor and run the WordPress e2e smoke test.
#   - e2e passes  -> commit to master, bump the patch version (0.5.0 -> 0.5.1), tag vX.Y.Z and publish a
#                    GitHub Release with wp-mcp-tools-X.Y.Z.zip. Sites running WP MCP Tools 0.5.0+ see the update
#                    (and install it themselves when "Enable auto-updates" is on).
#   - e2e fails   -> open (or refresh) a pull request for a human to look at. Nothing is released.
# Turn auto-release off: repository variable MCP_AUTO_RELEASE = false (Settings -> Secrets and variables -> Actions -> Variables),
# or run manually with auto_release = false. Then every update goes to a pull request.
name: Update bundled MCP Adapter

on:
  schedule:
    - cron: '17 2 * * 1' # Mondays 02:17 UTC (09:17 Vietnam time)
  workflow_dispatch:
    inputs:
      auto_release:
        description: 'Release automatically when the e2e test passes'
        type: boolean
        default: true

concurrency:
  group: update-mcp-adapter
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: sqlite3, pdo_sqlite, zip

      - name: Compare bundled and latest MCP Adapter
        id: ver
        run: |
          LATEST=$(curl -fsS https://repo.packagist.org/p2/wordpress/mcp-adapter.json \
            | jq -r '.packages["wordpress/mcp-adapter"][].version' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          CURRENT=$(jq -r '.packages[] | select(.name=="wordpress/mcp-adapter") | .version' vendor/composer/installed.json | sed 's/^v//')
          echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Bundled: $CURRENT  Latest: $LATEST"

      - name: Update composer.json, composer.lock and vendor/
        if: steps.ver.outputs.latest != steps.ver.outputs.current || hashFiles('composer.lock') == ''
        run: |
          composer require "wordpress/mcp-adapter:~${{ steps.ver.outputs.latest }}" --no-update --no-interaction
          composer update --no-dev --optimize-autoloader --no-interaction

      - name: PHP lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: E2E smoke test (fresh WordPress + SQLite, MCP initialize / tools/list / tools/call)
        id: e2e
        continue-on-error: true
        run: bash tests/e2e.sh "$RUNNER_TEMP/e2e"

      - name: Anything changed?
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decide
        id: mode
        env:
          AUTO_INPUT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.auto_release) || 'true' }}
          AUTO_VAR: ${{ vars.MCP_AUTO_RELEASE }}
        run: |
          AUTO=true
          [ "$AUTO_INPUT" = "false" ] && AUTO=false
          [ "$AUTO_VAR" = "false" ] && AUTO=false
          if [ "${{ steps.diff.outputs.changed }}" != "true" ]; then MODE=none
          elif [ "${{ steps.e2e.outcome }}" = "success" ] && [ "$AUTO" = "true" ]; then MODE=release
          else MODE=pr; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "Mode: $MODE (auto=$AUTO, e2e=${{ steps.e2e.outcome }})"

      - name: Bump version, commit to master, tag
        id: bump
        if: steps.mode.outputs.mode == 'release'
        run: |
          OLD=$(grep -oP "define\( 'WPMCP_VERSION', '\K[^']+" wp-mcp-tools.php)
          NEW=$(echo "$OLD" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i -E "s/^( \* Version: +)$OLD$/\1$NEW/" wp-mcp-tools.php
          sed -i "s/define( 'WPMCP_VERSION', '$OLD' );/define( 'WPMCP_VERSION', '$NEW' );/" wp-mcp-tools.php
          grep -q "Version:           $NEW" wp-mcp-tools.php && grep -q "'WPMCP_VERSION', '$NEW'" wp-mcp-tools.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "v$NEW: bundled MCP Adapter ${{ steps.ver.outputs.latest }}" -m "Automated: e2e smoke test passed (run ${{ github.run_id }})."
          git tag "v$NEW"
          git push origin HEAD:${{ github.ref_name }} "v$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build zip and publish the GitHub Release
        if: steps.mode.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.bump.outputs.version }}
          WPMCP_SIGNING_KEY: ${{ secrets.WPMCP_SIGNING_KEY }}
        run: |
          git archive --format=zip --prefix=wp-mcp-tools/ -o "wp-mcp-tools-$V.zip" "v$V"
          ASSETS="wp-mcp-tools-$V.zip"
          if [ -f includes/release-public.pem ]; then
            [ -n "$WPMCP_SIGNING_KEY" ] || { echo "::error::includes/release-public.pem exists but secret WPMCP_SIGNING_KEY is empty: an unsigned release would be refused by every site"; exit 1; }
            bash bin/sign-release.sh "wp-mcp-tools-$V.zip"
            ASSETS="$ASSETS wp-mcp-tools-$V.zip.sig"
          fi
          printf 'Automated release.\n\n- Bundled WordPress MCP Adapter: %s → %s\n- E2E smoke test: passed\n- MCP Adapter changelog: https://github.com/WordPress/mcp-adapter/blob/trunk/CHANGELOG.md\n' \
            "${{ steps.ver.outputs.current }}" "${{ steps.ver.outputs.latest }}" > notes.md
          gh release create "v$V" $ASSETS --title "v$V" --notes-file notes.md
          # A pull request left over from an earlier failed run is now obsolete.
          git push origin --delete update/mcp-adapter 2>/dev/null || true

      - name: Open or update the pull request
        if: steps.mode.outputs.mode == 'pr'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/mcp-adapter
          delete-branch: true
          commit-message: "Update bundled MCP Adapter to ${{ steps.ver.outputs.latest }}"
          title: "Update bundled MCP Adapter ${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.latest }}${{ steps.e2e.outcome == 'failure' && ' (e2e FAILED)' || '' }}"
          body: |
            Automated update of `wordpress/mcp-adapter` in `vendor/`.

            - Bundled: `${{ steps.ver.outputs.current }}`
            - Latest on Packagist: `${{ steps.ver.outputs.latest }}`
            - E2E smoke test: **${{ steps.e2e.outcome }}** (see the workflow run log)
            - Changelog: https://github.com/WordPress/mcp-adapter/blob/trunk/CHANGELOG.md

            Not released automatically (e2e failed, or auto-release is off). Before merging: read the changelog for
            breaking changes (0.x releases may change APIs), bump `Version:` + `WPMCP_VERSION` in `wp-mcp-tools.php`,
            update `AI/AI_HANDOFF.md`, then push a tag `vX.Y.Z` (release.yml builds the zip and the GitHub Release).

      - name: Fail the run if the e2e test failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
